<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini's Homely Masalas — How to use</title>
<meta name="description" content="Preparation instructions for Mini's Homely Masalas products." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF6EC;
    --bg-alt: #F4E9D3;
    --paper: #FFFDF8;
    --ink: #2B1B12;
    --ink-soft: #6B5847;
    --brand-dark: #241811;
    --brand-orange: #D98F3E;
    --chili: #A6320B;
    --chili-deep: #7C2408;
    --turmeric: #D98F3E;
    --cardamom: #57724F;
    --line: rgba(43,27,18,.14);
    --shadow: 0 2px 0 rgba(43,27,18,.06), 0 10px 24px -14px rgba(43,27,18,.35);
    --radius: 18px;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 90% -10%, var(--bg-alt), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Work Sans', -apple-system, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  a{ color:inherit; }

  .wrap{ max-width:640px; margin:0 auto; padding:0 20px 64px; }

  /* ---------- header ---------- */
  .topband{
    background:var(--brand-dark);
    background-image: radial-gradient(circle at 12% 30%, rgba(255,255,255,.05) 0, transparent 40%),
                       radial-gradient(circle at 85% 70%, rgba(255,255,255,.04) 0, transparent 45%);
    color:#FBF2E4;
    padding:18px 20px 30px;
  }
  .brandrow{
    max-width:640px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand-group{ display:flex; align-items:center; gap:10px; }
  .brand-logo{
    width:34px; height:34px; border-radius:50%;
    object-fit:cover; flex:none;
    border:1.5px solid rgba(255,255,255,.2);
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:.01em;
  }
  .brand em{ font-style:italic; font-weight:500; color:var(--turmeric); }
  .homelink{
    font-size:12.5px;
    color:#F3D9AE;
    text-decoration:none;
    border-bottom:1px solid rgba(243,217,174,.4);
    padding-bottom:1px;
    white-space:nowrap;
  }

  /* ---------- masthead / eyebrow ---------- */
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:26px 0 6px;
  }

  /* ---------- SELECTOR VIEW ---------- */
  .intro{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:26px;
    line-height:1.3;
    margin:0 0 22px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (min-width:480px){ .grid{ grid-template-columns:1fr 1fr 1fr; } }

  .card{
    display:block;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    text-decoration:none;
    color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(.98); }
  .card-img{
    aspect-ratio:1/1;
    background:var(--bg-alt);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .card-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-img .fallback-icon{ opacity:.35; }
  .card-body{ padding:10px 12px 14px; }
  .card-cat{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--cardamom);
    font-weight:600;
  }
  .card-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    margin-top:2px;
    line-height:1.25;
  }

  /* ---------- DETAIL VIEW ---------- */
  .back{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; color:var(--ink-soft);
    text-decoration:none;
    margin:22px 0 14px;
  }
  .back svg{ width:14px; height:14px; }

  .hero{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:22px;
  }
  .hero-img{
    width:100%; aspect-ratio:4/3;
    background:var(--bg-alt);
    object-fit:cover; display:block;
  }
  .hero-body{ padding:20px 20px 22px; }
  .hero-cat{
    display:inline-block;
    font-size:11px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase;
    color:var(--cardamom);
    background:rgba(87,114,79,.1);
    padding:3px 9px;
    border-radius:100px;
  }
  .hero-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.15;
    margin:10px 0 4px;
  }
  .hero-tagline{ color:var(--ink-soft); font-size:15px; margin:0; }

  /* signature element: the ratio badge, styled like a measuring spoon tag */
  .ratio-badge{
    margin-top:16px;
    display:flex; align-items:center; gap:10px;
    background:var(--brand-dark);
    color:#FBF2E4;
    border-radius:12px;
    padding:11px 14px;
  }
  .ratio-badge svg{ width:22px; height:22px; flex:none; color:var(--brand-orange); }
  .ratio-badge .rb-label{
    font-size:10px; text-transform:uppercase; letter-spacing:.09em;
    color:#E0B77C; margin-bottom:1px;
  }
  .ratio-badge .rb-value{
    font-family:'Fraunces', serif; font-weight:600; font-size:16px;
    color:var(--brand-orange);
  }

  .section{ margin-bottom:26px; }
  .section-title{
    font-family:'Fraunces', serif;
    font-style:italic; font-weight:500;
    font-size:19px;
    margin:0 0 12px;
  }

  /* ===== FEATURE: Hindi steps toggle (steps_hi) — remove this block + HINDI JS block to drop the feature ===== */
  .steps-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:12px;
  }
  .steps-head .section-title{ margin:0; }
  .section-title.hi{
    font-family:'Noto Sans Devanagari','Work Sans',sans-serif;
    font-style:normal; font-weight:600; font-size:18px;
  }
  .lang-toggle{
    display:inline-flex; flex:none;
    border:1px solid var(--line); border-radius:100px;
    background:var(--paper); overflow:hidden;
  }
  .lang-toggle button{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font:500 12.5px 'Work Sans','Noto Sans Devanagari',sans-serif;
    color:var(--ink-soft);
    padding:6px 13px;
  }
  .lang-toggle button[aria-pressed="true"]{
    background:var(--brand-dark); color:#FBF2E4;
  }
  .steps.hi .step-text{
    font-family:'Noto Sans Devanagari','Work Sans',sans-serif;
    line-height:1.65;
  }
  /* ===== END FEATURE: Hindi steps toggle CSS ===== */

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-size:13px;
    background:var(--bg-alt);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:100px;
    color:var(--ink);
  }

  .steps{ list-style:none; margin:0; padding:0; counter-reset:step; }
  .steps li{
    counter-increment:step;
    display:flex; gap:14px;
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .steps li:first-child{ border-top:none; }
  .steps li::before{
    content:counter(step);
    font-family:'Fraunces', serif; font-weight:600;
    color:var(--brand-orange);
    font-size:15px;
    flex:none;
    width:28px; height:28px;
    border:1.5px solid var(--brand-orange);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .step-text{ padding-top:3px; font-size:15px; }

  .video-frame{
    position:relative; width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:var(--ink);
    border:1px solid var(--line);
  }
  .video-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  .notes{
    background:var(--bg-alt);
    border-radius:14px;
    padding:16px 18px;
    font-size:14.5px;
    color:var(--ink-soft);
    display:flex; gap:10px;
  }
  .notes svg{ flex:none; width:18px; height:18px; margin-top:1px; color:var(--turmeric); }

  .footer-cta{
    text-align:center;
    padding-top:8px;
  }
  .footer-cta a{
    text-decoration:none;
    font-size:13.5px;
    color:var(--brand-dark);
    border-bottom:1px solid var(--line);
  }
  /* FIX: footer leaf icon had no size, so the SVG stretched to full width */
  .footer-cta svg{ width:14px; height:14px; vertical-align:-2px; margin-right:4px; }

  .footer-cta a + a{ margin-left:18px; }

  /* ===== FEATURE: Print cards CSS (see JS block "Print cards") — removable ===== */
  .eyebrow-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .print-link{
    flex:none; margin-bottom:4px;
    font-size:12.5px; font-weight:500; text-decoration:none;
    color:var(--brand-dark);
    border:1px solid var(--line); border-radius:100px;
    background:var(--paper); padding:6px 13px;
  }
  body.print-mode .topband{ display:none; }
  body.print-mode .wrap{ max-width:820px; }
  .print-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:18px 0 16px; }
  .tb-back{ font-size:13px; color:var(--ink-soft); text-decoration:none; }
  .print-btn{
    appearance:none; border:0; cursor:pointer;
    background:var(--brand-dark); color:#FBF2E4;
    font:600 13px 'Work Sans',sans-serif;
    padding:9px 16px; border-radius:100px;
  }

  .pcard{
    display:flex; flex-direction:column;
    background:#fff; color:#2B1B12;
    border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow);
    padding:28px; margin-bottom:22px;
    font-size:14px; line-height:1.5;
  }
  .pc-brand{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:2px solid var(--brand-orange); padding-bottom:10px; margin-bottom:18px;
  }
  .pc-brand-name{ display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:600; font-size:18px; }
  .pc-brand-name em{ font-style:italic; font-weight:500; color:var(--brand-orange); }
  .pc-logo{ width:26px; height:26px; border-radius:50%; object-fit:cover; }
  .pc-cat{
    font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--cardamom);
  }
  .pc-top{ display:flex; gap:20px; align-items:center; margin-bottom:18px; }
  .pc-img{ width:150px; height:150px; flex:none; object-fit:cover; border-radius:12px; background:var(--bg-alt); }
  .pc-title{ min-width:0; }
  .pc-name{ font-family:'Fraunces',serif; font-weight:600; font-size:28px; line-height:1.15; margin:0 0 6px; }
  .pc-tagline{ margin:0 0 12px; color:var(--ink-soft); font-size:14px; }
  .pc-ratio{
    display:inline-flex; flex-direction:column; gap:2px;
    background:var(--brand-dark); color:#FBF2E4; border-radius:10px; padding:8px 14px;
  }
  .pc-ratio span{ font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:#E0B77C; }
  .pc-ratio strong{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--brand-orange); }
  .pc-sec{ margin-bottom:16px; }
  .pc-h{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:17px; margin:0 0 8px; }
  .pc-h-hi{ font-family:'Noto Sans Devanagari','Work Sans',sans-serif; font-style:normal; font-weight:600; font-size:15px; }
  .pc-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .pc-chip{ font-size:12.5px; background:var(--bg-alt); border:1px solid var(--line); border-radius:100px; padding:4px 11px; }
  .pc-steps{ display:flex; flex-direction:column; }
  .pc-row{
    display:grid; grid-template-columns:28px 1fr; gap:12px;
    padding:10px 0; border-top:1px solid var(--line); break-inside:avoid; page-break-inside:avoid;
  }
  .pc-steps.two .pc-row{ grid-template-columns:28px 1fr 1fr; }
  .pc-row:first-child{ border-top:none; }
  .pc-n{
    width:26px; height:26px; border:1.5px solid var(--brand-orange); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:13px; color:var(--brand-orange);
  }
  .pc-en, .pc-hi{ padding-top:2px; font-size:13.5px; }
  .pc-hi{ font-family:'Noto Sans Devanagari','Work Sans',sans-serif; line-height:1.65; }
  .pc-video{ display:flex; align-items:center; gap:14px; break-inside:avoid; page-break-inside:avoid; }
  .pc-qr{ width:84px; height:84px; flex:none; }
  .pc-qr svg{ width:84px; height:84px; display:block; }
  .pc-link{ font-size:12.5px; color:var(--brand-dark); }
  .pc-notes{ background:var(--bg-alt); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--ink-soft); }
  .pc-foot{
    margin-top:auto; padding-top:12px; border-top:2px solid var(--brand-orange);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    font-size:12px; color:var(--ink-soft);
  }
  .pc-foot a{ color:inherit; text-decoration:none; }

  @page{ size:A4; margin:12mm; }
  @media print{
    html, body{ background:#fff !important; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body.print-mode .topband, .print-toolbar{ display:none !important; }
    body.print-mode .wrap{ max-width:none; padding:0; }
    .pcard{
      border:0; border-radius:0; box-shadow:none; padding:0; margin:0;
      min-height:262mm;
      break-after:page; page-break-after:always;
    }
    .pcard:last-child{ break-after:auto; page-break-after:auto; }
    .pc-img{ width:46mm; height:46mm; }
    .pc-qr, .pc-qr svg{ width:26mm; height:26mm; }
  }
  /* ===== END FEATURE: Print cards CSS ===== */

  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
</style>
</head>
<body>

<div class="topband">
  <div class="brandrow">
    <div class="brand-group">
      <img class="brand-logo" src="mini-logo.png" alt="" onerror="this.style.display='none'">
      <div class="brand">Mini's <em>Homely</em> Masalas</div>
    </div>
    <a class="homelink" href="?" id="homelink">All products</a>
  </div>
</div>

<div class="wrap" id="app">
  <div class="state-msg">Loading…</div>
</div>

async function loadProducts() {
  if (!SHEET_ID || SHEET_ID.startsWith("PASTE_")) {
    return DEMO_DATA;
  }
  // Direct CSV export — sheet just needs "Anyone with the link: Viewer" sharing.
  // No separate "Publish to web" step required.
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sheet fetch failed: ${res.status}`);
  const text = await res.text();
  return parseCSV(text);
}

/* Small CSV parser that handles quoted fields containing commas,
   newlines, and escaped quotes ("") — needed since columns like
   "ingredients_needed" and "notes" may contain commas. */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }

  const headers = rows.shift().map(h => h.toLowerCase().trim());
  return rows
    .filter(r => r.some(cell => cell.trim() !== ""))
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (r[i] || "").trim(); });
      return obj;
    });
}

/* ===== FEATURE: YouTube link/ID parsing =====

   (watch?v=, youtu.be/, /embed/, /shorts/). Returns "" if nothing usable. */
function youtubeId(v){
  v = (v || "").trim();
  if (!v) return "";
  const m = v.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{6,})/);

}
function stepsHtml(list){
  return list.map(s => `<li><span class="step-text">${s}</span></li>`).join("");
}
/* ===== END FEATURE: HINDI steps toggle (JS) ===== */

/* ===== FEATURE: Shared product parts (page + print) =====
   SPEC — Status: New. Single place that decides which pieces of a product exist.
   Rule: a piece with empty data is "" / [] / false and is NOT shown — on the page
   AND in the printout. renderDetail() and printCardHtml() both read from here.
   Dependencies: splitSteps(), youtubeId(). */
function productParts(p){
  const stepsEn = splitSteps(p.steps);
  const stepsHi = splitSteps(p.steps_hi);
  return {
    name: (p.name || "").trim(),
    category: (p.category || "").trim(),
    tagline: (p.tagline || "").trim(),
    ratio: (p.ratio || "").trim(),
    image: (p.image || "").trim(),
    notes: (p.notes || "").trim(),
    ingredients: (p.ingredients_needed || "").split(",").map(s => s.trim()).filter(Boolean),
    stepsEn: stepsEn,
    stepsHi: stepsHi,
    hasHi: stepsHi.length > 0,
    hasSteps: stepsEn.length > 0 || stepsHi.length > 0,
    vid: youtubeId(p.video_id)
  };
}
/* ===== END FEATURE: Shared product parts ===== */

/* ===== FEATURE: Print cards (?print=all | ?print=<product id>) — removable block =====
   SPEC — Status: New.
   Validation (plain English): only sections that have data are printed (see productParts);
     no product photo -> no photo block (the leaf placeholder is not printed);
     Hindi column appears only when steps_hi has content, otherwise English uses full width;
     video QR + link appear only when a valid video exists.
   Calculation: none. Layout: one A4 page per product, Hindi beside English, row by row.
   Dependencies: productParts(), IMAGE_BASE, FSSAI_NO, WHATSAPP_NO, inline QR library
     (qrcode-generator, MIT), print CSS block. Auto-opens the browser print dialog unless &auto=0. */
function imageSrc(filename){
  return /^https?:\/\//i.test(filename) ? filename : `${IMAGE_BASE}${filename}`;
}
function qrSvg(url){
  try {
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    return qr.createSvgTag({ scalable: true, margin: 0 });
  } catch (e) { return ""; }
}
function printCardHtml(p){
  const x = productParts(p);

  const photo = x.image
    ? `<img class="pc-img" src="${imageSrc(x.image)}" alt="" onerror="this.style.display='none'">` : "";

  const ratio = x.ratio
    ? `<div class="pc-ratio"><span>Mix ratio</span><strong>${x.ratio}</strong></div>` : "";

  const ingredients = x.ingredients.length ? `
    <div class="pc-sec">
      <h2 class="pc-h">You'll also need</h2>
      <div class="pc-chips">${x.ingredients.map(i => `<span class="pc-chip">${i}</span>`).join("")}</div>
    </div>` : "";

  let rows = "";
  const n = Math.max(x.stepsEn.length, x.stepsHi.length);
  for (let i = 0; i < n; i++) {
    rows += `<div class="pc-row"><span class="pc-n">${i + 1}</span>`
      + `<div class="pc-en">${x.stepsEn[i] || ""}</div>`
      + (x.hasHi ? `<div class="pc-hi">${x.stepsHi[i] || ""}</div>` : "")
      + `</div>`;
  }
  const steps = x.hasSteps ? `
    <div class="pc-sec">
      <h2 class="pc-h">How to prepare${x.hasHi ? ` <span class="pc-h-hi">· कैसे बनाएं</span>` : ""}</h2>
      <div class="pc-steps${x.hasHi ? " two" : ""}">${rows}</div>
    </div>` : "";

  const ytUrl = x.vid ? `https://youtu.be/${x.vid}` : "";
  const video = x.vid ? `
    <div class="pc-sec pc-video">
      <div class="pc-qr">${qrSvg(ytUrl)}</div>
      <div>
        <h2 class="pc-h">Watch how it's made</h2>
        <a class="pc-link" href="${ytUrl}">${ytUrl.replace("https://", "")}</a>
      </div>
    </div>` : "";

  const notes = x.notes ? `<div class="pc-sec"><div class="pc-notes">${x.notes}</div></div>` : "";

  return `
  <section class="pcard">
    <header class="pc-brand">
      <span class="pc-brand-name"><img class="pc-logo" src="mini-logo.png" alt="" onerror="this.style.display='none'">Mini's <em>Homely</em> Masalas</span>
      <span class="pc-cat">${x.category}</span>
    </header>
    <div class="pc-top">
      ${photo}
      <div class="pc-title">
        <h1 class="pc-name">${x.name}</h1>
        ${x.tagline ? `<p class="pc-tagline">${x.tagline}</p>` : ""}
        ${ratio}
      </div>
    </div>
    ${ingredients}
    ${steps}
    ${video}
    ${notes}
    <footer class="pc-foot">
      <span>FSSAI Lic. No. ${FSSAI_NO}</span>
      <span>WhatsApp: <a href="https://wa.me/91${WHATSAPP_NO}">${WHATSAPP_NO}</a></span>
    </footer>
  </section>`;
}
function imagesReady(){
  const imgs = Array.from(document.images).filter(i => !i.complete);
  const waits = imgs.map(i => new Promise(r => { i.onload = i.onerror = r; }));
  return Promise.race([Promise.all(waits), new Promise(r => setTimeout(r, 4000))]);
}
function renderPrint(products, which, autoPrint){
  const list = which === "all" ? products : products.filter(p => p.id === which);
  if (!list.length) { renderNotFound(which); return; }
  document.body.classList.add("print-mode");
  const backHref = which === "all" ? "?" : `?product=${encodeURIComponent(which)}`;
  app.innerHTML = `
    <div class="print-toolbar">
      <a class="tb-back" href="${backHref}">← Back</a>
      <button type="button" class="print-btn" id="print-btn">Print / Save as PDF</button>
    </div>
    ${list.map(printCardHtml).join("")}
  `;
  document.getElementById("print-btn").addEventListener("click", () => window.print());
  if (autoPrint) {
    const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.all([fontsReady, imagesReady()]).then(() => setTimeout(() => window.print(), 300));
  }
}
/* ===== END FEATURE: Print cards (JS) ===== */

function renderSelector(products) {
  document.getElementById("homelink").style.display = "none";
  const cards = products.map(p => `
    <a class="card" href="?product=${encodeURIComponent(p.id)}">
      <div class="card-img">${imgTag(p.image, p.name, "")}</div>
      <div class="card-body">
        <div class="card-cat">${p.category || ""}</div>
        <div class="card-name">${p.name}</div>
      </div>
    </a>
  `).join("");

  app.innerHTML = `
    <div class="eyebrow-row">
      <div class="eyebrow">How to use</div>
      <a class="print-link" href="?print=all">Print all (PDF)</a>
    </div>
    <p class="intro">Pick your pack, and we'll show you<br/>exactly how to make it.</p>
    <div class="grid">${cards}</div>
  `;
}

function renderDetail(p) {
  document.getElementById("homelink").style.display = "inline";

  const parts = productParts(p);   // same data rules as the print view
  const { stepsEn, stepsHi, hasHi, vid } = parts;
  const ingredients = parts.ingredients.map(i => `<span class="chip">${i}</span>`).join("");
  const startLang = hasHi ? getLang() : "en";

  const videoSection = vid ? `
    <div class="section">
      <h2 class="section-title">Watch how it's made</h2>
      <div class="video-frame">
        <iframe src="https://www.youtube.com/embed/${vid}"
          title="${p.name} preparation video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen loading="lazy"></iframe>
      </div>
    </div>` : "";

  const ingredientsSection = ingredients ? `
    <div class="section">
      <h2 class="section-title">You'll also need</h2>
      <div class="chips">${ingredients}</div>
    </div>` : "";

  const notesSection = parts.notes ? `
    <div class="section">
      <div class="notes">${iconInfo()}<span>${parts.notes}</span></div>
    </div>` : "";

  const stepsSection = parts.hasSteps ? `
    <div class="section">
      <div class="steps-head">
        <h2 class="section-title" id="steps-title">How to prepare</h2>
        ${hasHi ? `
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
        </div>` : ""}
      </div>
      <ul class="steps" id="steps-list">${stepsHtml(stepsEn)}</ul>
    </div>` : "";

  app.innerHTML = `
    <a class="back" href="?">${iconBack()} All products</a>
    <div class="hero">
      ${imgTag(p.image, p.name, "hero-img")}
      <div class="hero-body">
        <span class="hero-cat">${p.category || ""}</span>
        <h1 class="hero-name">${p.name}</h1>
        <p class="hero-tagline">${p.tagline || ""}</p>
        ${parts.ratio ? `
        <div class="ratio-badge">
          ${iconSpoon()}
          <div>
            <div class="rb-label">Mix ratio</div>
            <div class="rb-value">${parts.ratio}</div>
          </div>
        </div>` : ""}
      </div>
    </div>

    ${ingredientsSection}

    ${stepsSection}

    ${videoSection}
    ${notesSection}

    <div class="footer-cta">
      <a href="?">${iconLeaf()} See all Mini's products</a>
      <a href="?print=${encodeURIComponent(p.id)}">Print this card (PDF)</a>
    </div>
  `;

  /* ===== FEATURE: HINDI steps toggle (wiring) ===== */
  if (hasHi) {
    const titleEl = document.getElementById("steps-title");
    const listEl = document.getElementById("steps-list");
    const btns = app.querySelectorAll(".lang-toggle button");
    const applyLang = (l) => {
      const hi = l === "hi";
      titleEl.textContent = hi ? "कैसे बनाएं" : "How to prepare";
      titleEl.classList.toggle("hi", hi);
      listEl.classList.toggle("hi", hi);
      listEl.innerHTML = stepsHtml(hi ? stepsHi : stepsEn);
      btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    };
    btns.forEach(b => b.addEventListener("click", () => {
      setLang(b.dataset.lang);
      applyLang(b.dataset.lang);
    }));
    applyLang(startLang);
  }
  /* ===== END FEATURE: HINDI steps toggle (wiring) ===== */
}

function renderNotFound(id) {
  document.getElementById("homelink").style.display = "inline";
  app.innerHTML = `
    <div class="state-msg">
      We couldn't find instructions for "<strong>${id}</strong>".<br/><br/>
      <a href="?">Browse all products →</a>
    </div>
  `;
}

/* =========================================================
   Router
   ========================================================= */
(async function init() {
  let products = [];
  try {
    products = await loadProducts();
  } catch (e) {
    app.innerHTML = `<div class="state-msg">Couldn't load product info right now.<br/>Please check your connection and try again.</div>`;
    console.error(e);
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const printId = params.get("print");
  if (printId) {
    renderPrint(products, printId, params.get("auto") !== "0");
    return;
  }
  const productId = params.get("product");

  if (!productId) {
    renderSelector(products);
    return;
  }
  const product = products.find(p => p.id === productId);
  if (!product) {
    renderNotFound(productId);
    return;
  }
  renderDetail(product);
})();
</script>
</body>
</html>
